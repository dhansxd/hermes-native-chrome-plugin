name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
      - name: Install fixture dependencies
        run: |
          python -m venv "$RUNNER_TEMP/fixture-venv"
          "$RUNNER_TEMP/fixture-venv/bin/python" -m pip install -r requirements-test.txt
      - name: Full suite including fresh-HOME child gate
        run: |
          "$RUNNER_TEMP/fixture-venv/bin/python" -W error -m unittest discover -s tests -v

  plugin-checks:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: NousResearch/hermes-agent
          ref: d02f211858ab202d6d4d34ea59774591a5f14cbd
          path: .ci-hermes
          persist-credentials: false
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
      # PM owns this runner-only runtime. No plugin install/enable, browser
      # provisioning, consent, account access or modification of Hermes core.
      # Official developer workflow: docs/reference/package-management.
      - name: Prepare isolated official runtime and validate package
        shell: bash
        run: |
          set -euo pipefail
          package="$GITHUB_WORKSPACE"
          export HOME="$RUNNER_TEMP/hermes-ci-user"
          export HERMES_REAL_HOME="$HOME"
          export HERMES_HOME="$HOME/.hermes"
          export HERMES_RUNTIME_DIR="$HERMES_HOME/tools"
          export HERMES_GATEWAY_LOCK_DIR="$HOME/gateway-locks"
          export UV_CACHE_DIR="$HOME/uv-cache"
          export UV_PYTHON_INSTALL_DIR="$HOME/uv-python"
          mkdir -p "$HOME" "$HOME/tmp" "$HERMES_GATEWAY_LOCK_DIR"
          export TMPDIR="$HOME/tmp" TMP="$HOME/tmp" TEMP="$HOME/tmp"
          unset PYTHONPATH PYTHONHOME VIRTUAL_ENV __HERMES_ACTIVATED HERMES_PYTHON
          mv "$GITHUB_WORKSPACE/.ci-hermes" "$RUNNER_TEMP/official-hermes"
          cd "$RUNNER_TEMP/official-hermes"
          test "$(git rev-parse HEAD)" = d02f211858ab202d6d4d34ea59774591a5f14cbd
          # uv is bootstrap only; never pip/uv-mutate the PM-selected runtime.
          uv python install 3.14
          bootstrap="$(uv python find --managed-python 3.14)"
          "$bootstrap" -m pm.cli install --without agent-browser --without cua-driver
          eval "$("$bootstrap" -m pm.environments --format sh)"
          python hermes plugins doctor "$package" --ci
          python hermes plugins validate "$package" --json
          # Read-only checks must not patch tracked upstream source.
          git diff --exit-code
